name: Update stat sheet

on:
  schedule:
    - cron: "0 6 * * *"      # 06:00 UTC daily (07:00 UK in summer, 06:00 in winter)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # to commit the updated cache and page
  pages: write                # to publish to GitHub Pages
  id-token: write

concurrency:
  group: stat-sheet
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350      # GitHub's own limit is 360
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch rankings, stats, trinkets and talents
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: |
          python wcl_mythic_stats.py --all --no-open \
            --out site/index.html \
            --deadline 320

      - name: Save the updated cache and page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A wcl_cache site
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update stat sheet [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
