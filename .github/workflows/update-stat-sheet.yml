name: Update stat sheet

on:
  schedule:
    # Hourly: each run spends that hour's API allowance, then publishes.
    # Once the raid is fully loaded you can switch to the daily line below.
    - cron: "5 * * * *"
    # - cron: "0 6 * * *"    # 06:00 UTC daily (07:00 UK in summer, 06:00 in winter)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # to commit the updated cache and page
  pages: write                # to publish to GitHub Pages
  id-token: write

concurrency:
  group: stat-sheet
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50       # must finish before the next run starts
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history, so the save step can rebase

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unpack wcl_cache.zip if it was uploaded
        run: |
          if [ -f wcl_cache.zip ]; then
            mkdir -p wcl_cache
            unzip -q -o wcl_cache.zip -d unzipped
            # the zip may or may not contain a top-level wcl_cache folder
            if [ -d unzipped/wcl_cache ]; then
              cp -rn unzipped/wcl_cache/. wcl_cache/
            else
              cp -rn unzipped/. wcl_cache/
            fi
            rm -rf unzipped wcl_cache.zip
            echo "Unpacked $(find wcl_cache -type f | wc -l) cached files."
          fi

      - name: Fetch rankings, stats, trinkets and talents
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: |
          python wcl_mythic_stats.py --all --no-open \
            --out site/index.html \
            --deadline 40 \
            --stop-at-limit \
            --rank-age 20 \
            --prune

      - name: Save the updated cache and page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A wcl_cache site
          if git diff --staged --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Update stat sheet [skip ci]"
          # If the repo changed while this run was going (an upload, say), rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Saved."
              exit 0
            fi
            echo "Push rejected, bringing in the newer changes (attempt $attempt)..."
            git pull --rebase --autostash origin ${{ github.ref_name }} || {
              echo "Rebase hit a conflict; keeping this run's data files."
              git checkout --ours -- wcl_cache site 2>/dev/null || true
              git add -A wcl_cache site
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            }
            sleep 5
          done
          echo "Could not save after 5 tries."
          exit 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
