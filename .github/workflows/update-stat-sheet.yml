name: Update stat sheet

on:
  schedule:
    # Daily at midnight UTC (1am UK in summer, midnight in winter).
    # For catching up on a new raid, swap this for the hourly line below.
    - cron: "0 0 * * *"
    # - cron: "5 * * * *"    # hourly: each run spends that hour's allowance, then publishes
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # to commit the updated cache and page
  pages: write                # to publish to GitHub Pages
  id-token: write

concurrency:
  group: stat-sheet
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350      # GitHub's own limit is 360
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history, so the save step can rebase

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unpack wcl_cache.zip if it was uploaded
        run: |
          if [ -f wcl_cache.zip ]; then
            mkdir -p wcl_cache
            unzip -q -o wcl_cache.zip -d unzipped
            # the zip may or may not contain a top-level wcl_cache folder
            if [ -d unzipped/wcl_cache ]; then
              cp -rn unzipped/wcl_cache/. wcl_cache/
            else
              cp -rn unzipped/. wcl_cache/
            fi
            rm -rf unzipped wcl_cache.zip
            echo "Unpacked $(find wcl_cache -type f | wc -l) cached files."
          fi

      - name: Fetch rankings, stats, trinkets and talents
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: |
          python wcl_mythic_stats.py --all --no-open \
            --out site/index.html \
            --deadline 320 \
            --rank-age 20 \
            --prune \
            --addon build/MythicStats \
            --interface 120100,120105

      - name: Mythic+ comps from Raider.IO
        env:
          RIO_API_KEY: ${{ secrets.RIO_API_KEY }}
        run: |
          python mplus.py --out site/mplus.html --pages 5 || echo "Mythic+ step failed; the rest of the site is unaffected."

      - name: Zip the in-game addon for download
        run: |
          if [ -d build/MythicStats ]; then
            (cd build && zip -qr ../site/MythicStats.zip MythicStats)
            ls -lh site/MythicStats.zip
          fi

      - name: Publish the desktop updater
        run: |
          if [ -f Update-MythicStats.bat ]; then cp Update-MythicStats.bat site/; fi

      - name: Save the updated cache and page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A wcl_cache site
          if git diff --staged --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Update stat sheet [skip ci]"
          # If the repo changed while this run was going (an upload, say), rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Saved."
              exit 0
            fi
            echo "Push rejected, bringing in the newer changes (attempt $attempt)..."
            git pull --rebase --autostash origin ${{ github.ref_name }} || {
              echo "Rebase hit a conflict; keeping this run's data files."
              git checkout --ours -- wcl_cache site 2>/dev/null || true
              git add -A wcl_cache site
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            }
            sleep 5
          done
          echo "Could not save after 5 tries."
          exit 1

      - name: Publish a GitHub release (this is what WowUp reads)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f site/MythicStats.zip ]; then
            echo "No addon zip to release."
            exit 0
          fi
          tag="v$(date -u +%Y.%m.%d)"
          notes="Rankings refreshed on $(date -u +%Y-%m-%d). Top 10 Mythic logs per spec, with stats, trinkets, potions and talent codes."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" site/MythicStats.zip --clobber
            echo "Updated release $tag."
          else
            gh release create "$tag" site/MythicStats.zip \
              --title "Mythic Stat Sheet $tag" --notes "$notes" --latest
            echo "Created release $tag."
          fi

      - name: Upload the addon to CurseForge (once a day, if it changed)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ secrets.CF_PROJECT_ID }}
        run: |
          python cf_upload.py site/MythicStats.zip --interface 120100,120105
          git add -A .cf_last_upload || true
          if ! git diff --staged --quiet; then
            git commit -m "CurseForge upload marker [skip ci]"
            git push || true
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
